[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
    "vamo",
    "vamo-macros",
]

[workspace.package]
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/vamo"
homepage = "https://github.com/ararog/vamo"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[workspace.dependencies]
base64 = "0.23.0"
#deboa = { path = "../deboa/deboa" }
deboa = { version = "0.1.5-beta.2" }
#deboa-extras = { path = "../deboa-contrib/deboa-extras" }
deboa-extras = { version  = "0.1.1-beta.2" }
deboa-fory = { path = "../deboa-contrib/deboa-fory" }
#deboa-macros = { path = "../deboa/deboa-macros" }
deboa-macros = { version = "0.1.0-beta.7" }
deboa-tokio = { path = "../deboa-tokio/deboa-tokio" }
http = "1.5.0"
serde = "1.0.228"
vamo = { path = "vamo", version = "0.1.2-beta.2" }
vamo-macros = { path = "vamo-macros" }

[profile.test]
lto = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
# Replace 'rand' from crates.io with your local modified version
deboa = { path = "../deboa/deboa" }
