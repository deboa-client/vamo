[package]
name = "vamo-macros"
version = "0.1.2-beta.5"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Macros for quick client development using vamo"
license.workspace = true
readme = "README.md"
keywords = ["compiler-plugin", "macros", "resources", "http", "rest"]
publish = true
rust-version.workspace = true

[features]
default = ["json"]

# Serialization formats
json = ["deboa-extras/json"]
xml = ["deboa-extras/xml"]
msgpack = ["deboa-extras/msgpack"]

[lib]
proc-macro = true

[dependencies]
deboa = { workspace = true }
deboa-extras = { workspace = true, optional = true }
http = { workspace = true }
proc-macro2 = "1.0.103"
serde = { workspace = true }
syn = { version = "3.0", features = ["full"] }
quote = "1.0.41"
regex = { version = "1.12.4", default-features = false }
titlecase = "3.6.0"
vamo = { workspace = true }
pluralizer = "0.5.0"

[dev-dependencies]
trybuild = "1.0.111"
deboa-extras = { workspace = true }
