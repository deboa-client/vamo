[package]
name = "vamo"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A rest wrapper for deboa http client."
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version.workspace = true

[features]
default = [
  "json",
]

json = ["deboa-extras/json"]

[dependencies]
deboa = { workspace = true }
deboa-extras = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
url = "2.5"

[dev-dependencies]
caramelo = "0.1"
